[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "single-node-llm-lab"
version = "0.1.0"
description = "A transparent single-node continual pretraining, SFT, DPO, and GRPO lab"
requires-python = ">=3.10,<3.13"
dependencies = [
  "accelerate>=1.2,<2",
  "fastapi>=0.115,<1",
  "peft>=0.15,<1",
  "pyyaml>=6,<7",
  "safetensors>=0.5,<1",
  "transformers>=4.51,<5",
  "uvicorn[standard]>=0.34,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

